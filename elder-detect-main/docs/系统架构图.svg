<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d05c7c"/>
    </marker>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3fa3d6"/>
    </marker>
    <marker id="arwE" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#43b36a"/>
    </marker>
    <marker id="arwP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d49a3a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="920" fill="#0f1419"/>

  <!-- title -->
  <text x="40" y="34" font-size="22" font-weight="700" fill="#e6edf3">老年人跌倒风险预测系统 · 系统架构图</text>
  <text x="40" y="54" font-size="13" fill="#9fb0c0">三因子融合：行为姿态 B（实时态势）＋ 环境 E（离线感知）＋ 个体生理 P（问卷规则） → 双输出 risk_short / risk_long</text>

  <!-- config strip -->
  <rect x="20" y="64" width="1240" height="34" rx="6" fill="#161c26" stroke="#3a4452" stroke-width="1"/>
  <text x="36" y="86" font-size="12.5" fill="#c9d4e0">⚙ 配置中心 <tspan fill="#7fd0a0" font-weight="600">scripts/build_config.py</tspan> — 单一事实源：WINDOW_SIZE=35 · FUSE_* · THR_* · CTX_* · ENV_* · HOME_FAST_* · P_*（CLI --xxx 可覆盖，绝不硬编码）</text>

  <!-- ============ B LANE ============ -->
  <text x="30" y="120" font-size="14" font-weight="700" fill="#3fa3d6">① 行为姿态 B（实时，唯一态势分量）</text>

  <g>
    <rect x="30" y="130" width="160" height="96" rx="8" fill="#16313f" stroke="#2f81a8" stroke-width="1.5"/>
    <text x="110" y="158" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="110" dy="0">RGB 视频</tspan><tspan x="110" dy="19">摄像头 / 文件</tspan><tspan x="110" dy="19" fill="#9fb0c0">（唯一数据源）</tspan></text>
  </g>
  <g>
    <rect x="235" y="130" width="200" height="96" rx="8" fill="#16313f" stroke="#2f81a8" stroke-width="1.5"/>
    <text x="335" y="158" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="335" dy="0">PoseExtractor</tspan><tspan x="335" dy="19">MediaPipe 33点</tspan><tspan x="335" dy="19" fill="#9fb0c0">2D + 3D 世界坐标</tspan></text>
  </g>
  <g>
    <rect x="470" y="130" width="210" height="96" rx="8" fill="#16313f" stroke="#2f81a8" stroke-width="1.5"/>
    <text x="575" y="150" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="575" dy="0">FrameFeatureBuilder</tspan><tspan x="575" dy="17">单帧 → 29 维</tspan><tspan x="575" dy="17" fill="#9fb0c0">[步速,躯干角,宽高比,</tspan><tspan x="575" dy="17" fill="#9fb0c0"> 13核×2(xy)]</tspan></text>
  </g>
  <g>
    <rect x="715" y="130" width="200" height="96" rx="8" fill="#16313f" stroke="#2f81a8" stroke-width="1.5"/>
    <text x="815" y="158" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="815" dy="0">SlidingWindowBuilder</tspan><tspan x="815" dy="19">滑窗 W=35</tspan><tspan x="815" dy="19" fill="#9fb0c0">→ (N, 35, 29)</tspan></text>
  </g>
  <g>
    <rect x="950" y="130" width="190" height="96" rx="8" fill="#16313f" stroke="#2f81a8" stroke-width="1.5"/>
    <text x="1045" y="158" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="1045" dy="0">LSTM 模型</tspan><tspan x="1045" dy="19">FallLSTM(3分类)</tspan><tspan x="1045" dy="19" fill="#9fb0c0">RiskRegressor(连续)</tspan></text>
  </g>
  <!-- B arrows -->
  <line x1="190" y1="178" x2="233" y2="178" stroke="#3fa3d6" stroke-width="2" marker-end="url(#arwB)"/>
  <line x1="435" y1="178" x2="468" y2="178" stroke="#3fa3d6" stroke-width="2" marker-end="url(#arwB)"/>
  <line x1="680" y1="178" x2="713" y2="178" stroke="#3fa3d6" stroke-width="2" marker-end="url(#arwB)"/>
  <line x1="915" y1="178" x2="948" y2="178" stroke="#3fa3d6" stroke-width="2" marker-end="url(#arwB)"/>
  <text x="1045" y="244" font-size="13" font-weight="700" fill="#3fa3d6" text-anchor="middle">B ∈ [0,1]</text>

  <!-- ============ E LANE ============ -->
  <text x="30" y="310" font-size="14" font-weight="700" fill="#43b36a">② 环境风险 E（离线感知，长周期 ＋ 阈值上下文）</text>

  <g>
    <rect x="30" y="320" width="150" height="96" rx="8" fill="#14331f" stroke="#2f9e54" stroke-width="1.5"/>
    <text x="105" y="350" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="105" dy="0">视频抽帧</tspan><tspan x="105" dy="19">env_extract_frames</tspan><tspan x="105" dy="19" fill="#9fb0c0">K=3 帧</tspan></text>
  </g>
  <g>
    <rect x="215" y="320" width="200" height="96" rx="8" fill="#14331f" stroke="#2f9e54" stroke-width="1.5"/>
    <text x="315" y="350" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="315" dy="0">R1 VLM 打标</tspan><tspan x="315" dy="19">env_label_vlm</tspan><tspan x="315" dy="19" fill="#9fb0c0">(ark Doubao-vision)</tspan></text>
  </g>
  <g>
    <rect x="450" y="320" width="210" height="96" rx="8" fill="#14331f" stroke="#2f9e54" stroke-width="1.5"/>
    <text x="555" y="350" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="555" dy="0">HomeFastModel</tspan><tspan x="555" dy="19">.from_labels / .score</tspan><tspan x="555" dy="19" fill="#9fb0c0">HOME FAST 25题规则</tspan></text>
  </g>
  <g>
    <rect x="695" y="320" width="210" height="96" rx="8" fill="#14331f" stroke="#2f9e54" stroke-width="1.5"/>
    <text x="800" y="350" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="800" dy="0">环境分 E = T/N_obs</tspan><tspan x="800" dy="19">→ sidecar</tspan><tspan x="800" dy="19" fill="#9fb0c0">env_perceive 编排</tspan></text>
  </g>
  <!-- R0 branch -->
  <g>
    <rect x="450" y="268" width="210" height="36" rx="6" fill="#1b2a1f" stroke="#2f9e54" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="555" y="291" font-size="12" fill="#c9e6d4" text-anchor="middle">R0 问卷直传（25题 0/1答）</text>
  </g>
  <!-- E arrows -->
  <line x1="180" y1="368" x2="213" y2="368" stroke="#43b36a" stroke-width="2" marker-end="url(#arwE)"/>
  <line x1="415" y1="368" x2="448" y2="368" stroke="#43b36a" stroke-width="2" marker-end="url(#arwE)"/>
  <line x1="660" y1="368" x2="693" y2="368" stroke="#43b36a" stroke-width="2" marker-end="url(#arwE)"/>
  <line x1="555" y1="304" x2="555" y2="318" stroke="#43b36a" stroke-width="2" marker-end="url(#arwE)"/>

  <!-- ============ P LANE ============ -->
  <text x="30" y="460" font-size="14" font-weight="700" fill="#d49a3a">③ 个体生理 P（问卷规则，长周期 ＋ 调阈值）</text>

  <g>
    <rect x="30" y="470" width="210" height="92" rx="8" fill="#33260f" stroke="#c08a2f" stroke-width="1.5"/>
    <text x="135" y="500" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="135" dy="0">个体问卷</tspan><tspan x="135" dy="19">年龄/跌倒史/用药</tspan><tspan x="135" dy="19" fill="#9fb0c0">独居/眩晕/助行器…</tspan></text>
  </g>
  <g>
    <rect x="270" y="470" width="200" height="92" rx="8" fill="#33260f" stroke="#c08a2f" stroke-width="1.5"/>
    <text x="370" y="500" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="370" dy="0">compute_P</tspan><tspan x="370" dy="19">规则器</tspan><tspan x="370" dy="19" fill="#9fb0c0">(P_MAX=100)</tspan></text>
  </g>
  <g>
    <rect x="505" y="470" width="210" height="92" rx="8" fill="#33260f" stroke="#c08a2f" stroke-width="1.5"/>
    <text x="610" y="500" font-size="13" fill="#e6edf3" text-anchor="middle"><tspan x="610" dy="0">P ∈ [0,1]</tspan><tspan x="610" dy="19">仅进长期</tspan><tspan x="610" dy="19" fill="#9fb0c0">＋ 调报警阈值</tspan></text>
  </g>
  <!-- P arrows -->
  <line x1="240" y1="516" x2="268" y2="516" stroke="#d49a3a" stroke-width="2" marker-end="url(#arwP)"/>
  <line x1="470" y1="516" x2="503" y2="516" stroke="#d49a3a" stroke-width="2" marker-end="url(#arwP)"/>

  <!-- ============ FUSION ============ -->
  <g>
    <rect x="430" y="620" width="440" height="124" rx="10" fill="#241634" stroke="#8a5cd0" stroke-width="2"/>
    <text x="650" y="642" font-size="13.5" font-weight="700" fill="#d9c2f5" text-anchor="middle">fuse_risk.fuse(B, E, P)</text>
    <text x="650" y="662" font-size="11.5" fill="#b9a6e0" text-anchor="middle">────────────────────────────</text>
    <text x="650" y="682" font-size="11.5" fill="#e6edf3" text-anchor="middle">risk_short = B    （E/P <tspan fill="#ff9b9b">不进分数</tspan>）</text>
    <text x="650" y="700" font-size="11.5" fill="#e6edf3" text-anchor="middle">ctx = 0.60·E + 0.40·P</text>
    <text x="650" y="718" font-size="11.5" fill="#e6edf3" text-anchor="middle">θ_alarm = clamp(0.60 - 0.20·ctx, 0.45, 0.60)</text>
    <text x="650" y="736" font-size="11.5" fill="#e6edf3" text-anchor="middle">alarm ⇔ B ≥ θ_alarm ｜ risk_long = 0.15·E + 0.40·P</text>
  </g>

  <!-- convergence arrows -->
  <path d="M1045,226 L1045,600 L870,600 L870,618" fill="none" stroke="#3fa3d6" stroke-width="2" marker-end="url(#arwB)"/>
  <path d="M800,416 L800,598 L650,598 L650,618" fill="none" stroke="#43b36a" stroke-width="2" marker-end="url(#arwE)"/>
  <path d="M610,562 L610,596 L650,596 L650,618" fill="none" stroke="#d49a3a" stroke-width="2" marker-end="url(#arwP)"/>

  <!-- ============ OUTPUTS ============ -->
  <g>
    <rect x="300" y="790" width="300" height="96" rx="8" fill="#3a1420" stroke="#d05c7c" stroke-width="1.5"/>
    <text x="450" y="818" font-size="13.5" font-weight="700" fill="#f3c2d0" text-anchor="middle"><tspan x="450" dy="0">risk_short 短期报警</tspan><tspan x="450" dy="19" fill="#e6edf3">SAFE / WARNING / DANGER</tspan><tspan x="450" dy="19" fill="#9fb0c0">秒级；≥θ_alarm 触发</tspan><tspan x="450" dy="19" fill="#9fb0c0">零延时呼救 + 同室喝止</tspan></text>
  </g>
  <g>
    <rect x="680" y="790" width="300" height="96" rx="8" fill="#3a1420" stroke="#d05c7c" stroke-width="1.5"/>
    <text x="830" y="818" font-size="13.5" font-weight="700" fill="#f3c2d0" text-anchor="middle"><tspan x="830" dy="0">risk_long 长期监护分</tspan><tspan x="830" dy="19" fill="#e6edf3">watch / warning / critical</tspan><tspan x="830" dy="19" fill="#9fb0c0">天/周级分档筛查</tspan><tspan x="830" dy="19" fill="#9fb0c0">结构性干预（预防）抓手</tspan></text>
  </g>
  <!-- outputs arrows -->
  <line x1="560" y1="740" x2="450" y2="788" stroke="#d05c7c" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="740" y1="740" x2="830" y2="788" stroke="#d05c7c" stroke-width="2" marker-end="url(#arw)"/>

  <!-- I-gate note -->
  <text x="880" y="690" font-size="11" fill="#9fb0c0">可选 I-gate（意图轨道,</text>
  <text x="880" y="706" font-size="11" fill="#9fb0c0">env_mask + intent,</text>
  <text x="880" y="722" font-size="11" fill="#9fb0c0">默认关闭, 仅调 E_eff）</text>

  <!-- legend -->
  <g>
    <rect x="980" y="790" width="270" height="96" rx="8" fill="#161c26" stroke="#3a4452" stroke-width="1"/>
    <rect x="996" y="806" width="14" height="14" rx="3" fill="#16313f" stroke="#2f81a8"/><text x="1018" y="818" font-size="12" fill="#c9d4e0">B 行为姿态（实时）</text>
    <rect x="996" y="828" width="14" height="14" rx="3" fill="#14331f" stroke="#2f9e54"/><text x="1018" y="840" font-size="12" fill="#c9d4e0">E 环境风险（离线）</text>
    <rect x="996" y="850" width="14" height="14" rx="3" fill="#33260f" stroke="#c08a2f"/><text x="1018" y="862" font-size="12" fill="#c9d4e0">P 个体生理（问卷）</text>
    <rect x="996" y="872" width="14" height="14" rx="3" fill="#241634" stroke="#8a5cd0"/><text x="1018" y="884" font-size="12" fill="#c9d4e0">融合 + 双输出</text>
  </g>
</svg>
