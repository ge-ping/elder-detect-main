<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#212529">逐帧目标风险 y(t) 曲线（一条跌倒序列，fps≈25）</text>

  <!-- plot frame -->
  <rect x="70" y="40" width="580" height="300" fill="#fafbfc" stroke="#ced4da" stroke-width="1"/>

  <!-- shaded ramp region (pre-fall) -->
  <rect x="412.7" y="40" width="184.6" height="300" fill="#fff3bf" opacity="0.5"/>

  <!-- reference horizontal lines -->
  <!-- RAMP_HI 0.7 -->
  <line x1="70" y1="130" x2="650" y2="130" stroke="#868e96" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="654" y="134" font-size="11" fill="#868e96">RAMP_HI 0.7（标签封顶）</text>
  <!-- DANGER 0.6 -->
  <line x1="70" y1="160" x2="650" y2="160" stroke="#e03131" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="654" y="164" font-size="11" fill="#e03131">DANGER 0.6（报警线）</text>
  <!-- WARNING 0.3 -->
  <line x1="70" y1="250" x2="650" y2="250" stroke="#f08c00" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="654" y="254" font-size="11" fill="#f08c00">WARNING 0.3</text>

  <!-- y axis labels -->
  <text x="60" y="44" text-anchor="end" font-size="11" fill="#495057">1.0</text>
  <text x="60" y="134" text-anchor="end" font-size="11" fill="#495057">0.7</text>
  <text x="60" y="164" text-anchor="end" font-size="11" fill="#495057">0.6</text>
  <text x="60" y="254" text-anchor="end" font-size="11" fill="#495057">0.3</text>
  <text x="60" y="344" text-anchor="end" font-size="11" fill="#495057">0.0</text>
  <text x="34" y="195" text-anchor="middle" font-size="12" fill="#495057" transform="rotate(-90 34 195)">risk</text>

  <!-- main curve -->
  <!-- ⑤ normal flat y=0 -->
  <polyline points="70,340 333.6,340" fill="none" stroke="#adb5bd" stroke-width="2.5"/>
  <!-- u_start step -->
  <line x1="333.6" y1="340" x2="333.6" y2="250" stroke="#adb5bd" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- ④ 保底 flat y=0.3 -->
  <polyline points="333.6,250 412.7,250" fill="none" stroke="#f59f00" stroke-width="2.5"/>
  <!-- ② pre-fall ramp -->
  <polyline points="412.7,243.5 449.6,238.4 491.8,227.3 533.9,205.9 565.7,177.2 581.5,156.5 597.3,130" fill="none" stroke="#e8590c" stroke-width="3"/>
  <!-- f_start step -->
  <line x1="597.3" y1="130" x2="597.3" y2="40" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="3 3"/>
  <!-- ① fall flat y=1.0 -->
  <polyline points="597.3,40 650,40" fill="none" stroke="#c92a2a" stroke-width="2.5"/>

  <!-- anchor markers -->
  <line x1="333.6" y1="40" x2="333.6" y2="345" stroke="#343a40" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="333.6" y="362" text-anchor="middle" font-size="10.5" fill="#343a40">u_start(50)</text>
  <line x1="597.3" y1="40" x2="597.3" y2="345" stroke="#343a40" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="597.3" y="376" text-anchor="middle" font-size="10.5" fill="#343a40">f_start(100)</text>
  <text x="412.7" y="362" text-anchor="middle" font-size="10" fill="#868e96">f_start−H(65)</text>

  <!-- branch labels on top -->
  <text x="200" y="56" text-anchor="middle" font-size="11" fill="#868e96">⑤ 正常 y=0</text>
  <text x="373" y="56" text-anchor="middle" font-size="11" fill="#f08c00">④ 保底 0.3</text>
  <text x="505" y="56" text-anchor="middle" font-size="11" fill="#e8590c">② pre-fall ramp 0.3→0.7</text>
  <text x="623" y="56" text-anchor="middle" font-size="11" fill="#c92a2a">① 跌倒 1.0</text>

  <!-- x axis caption -->
  <text x="360" y="394" text-anchor="middle" font-size="12" fill="#495057">时间（帧）→　约 1.4s 预警窗：f_start 前 35 帧内风险指数爬升</text>
</svg>
